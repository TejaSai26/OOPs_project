<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reviews</title>
  <link rel="icon" href="/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;560;650&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body data-auth="user">
<header class="top"><a class="brand" href="/index.html">Campus <span>Resource Hub</span></a><nav data-nav></nav></header>
<div class="shell"><aside class="side" data-side></aside><main>

<p class="kicker">Reputation</p>
<h1>Your reviews</h1>
<p class="lede">A review can be written only after you return the item. Each borrowing accepts one review.</p>
<div id="list"></div>
</main></div>

<script src="/js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  try {
    const rows = await api("/api/reviews/my");
    document.getElementById("list").innerHTML = rows.length ? rows.map(r => `
      <article class="card" style="margin-top:10px"><h3>${escapeHtml(r.listingTitle)}</h3><p>${stars(r.rating)} · ${when(r.createdAt)}</p><p>${escapeHtml(r.comment || "")}</p></article>`).join("") : `<p class="empty">No reviews yet. Return a loan, then rate it from Borrowings.</p>`;
  } catch (err) { toast(err.message, true); }
});
</script>

</body></html>
