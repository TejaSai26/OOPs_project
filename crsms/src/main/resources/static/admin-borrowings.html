<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Borrowings</title>
  <link rel="icon" href="/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;560;650&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body data-auth="admin">
<header class="top"><a class="brand" href="/index.html">Campus <span>Resource Hub</span></a><nav data-nav></nav></header>
<div class="shell"><aside class="side" data-side></aside><main>

<p class="kicker">Administration</p><h1>All borrowings</h1>
<div class="table-wrap card"><table><thead><tr><th>Item</th><th>Picked up</th><th>Due</th><th>Charge</th><th>Penalty</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</main></div>

<script src="/js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  try {
    const rows = await api("/api/admin/borrowings");
    document.getElementById("rows").innerHTML = rows.map(row => `<tr><td>${escapeHtml(row.listingTitle)} · ${escapeHtml(row.assetCode)}</td><td>${when(row.pickedUpAt)}</td><td>${when(row.dueAt)}</td><td>${money(row.chargeAmount)}</td><td>${money(row.penaltyAmount)} ${badge(row.penaltyStatus)}</td><td>${badge(row.status)}</td></tr>`).join("") || emptyRow(6, "No loans yet.");
  } catch (err) { toast(err.message, true); }
});
</script>

</body></html>
