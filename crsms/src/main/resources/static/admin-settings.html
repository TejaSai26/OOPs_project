<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Settings</title>
  <link rel="icon" href="/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;560;650&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body data-auth="admin">
<header class="top"><a class="brand" href="/index.html">Campus <span>Resource Hub</span></a><nav data-nav></nav></header>
<div class="shell"><aside class="side" data-side></aside><main>

<p class="kicker">Administration</p><h1>Penalty settings</h1>
<p class="lede">The late fee is the normal price for the overdue time, multiplied by the factor below. Borrowers are reminded this many hours before a due time.</p>
<form id="form" class="card" style="max-width:480px">
  <label>Late fee multiplier</label><input name="lateFeeMultiplier" type="number" min="0" max="10" step="0.01" required/>
  <label>Reminder window (hours)</label><input name="reminderHours" type="number" min="1" max="168" required/>
  <button type="submit">Save settings</button>
</form>
</main></div>

<script src="/js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const form = document.getElementById("form");
  try {
    const settings = await api("/api/admin/settings");
    form.lateFeeMultiplier.value = settings.lateFeeMultiplier;
    form.reminderHours.value = settings.reminderHours;
  } catch (err) { toast(err.message, true); }
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    data.lateFeeMultiplier = Number(data.lateFeeMultiplier);
    data.reminderHours = Number(data.reminderHours);
    try { await api("/api/admin/settings", { method: "PUT", body: data }); toast("Settings saved"); }
    catch (err) { toast(err.message, true); }
  };
});
</script>

</body></html>
