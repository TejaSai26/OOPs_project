# Embedded file database so the app runs without a separate PostgreSQL process.
# This is NOT a native OODBMS and NOT PostgreSQL. Use the postgres profile for PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:file:./data/crsms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:}
  h2:
    console:
      enabled: false
