<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Resources</title>
  <link rel="icon" href="/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;560;650&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body data-auth="admin">
<header class="top"><a class="brand" href="/index.html">Campus <span>Resource Hub</span></a><nav data-nav></nav></header>
<div class="shell"><aside class="side" data-side></aside><main>

<p class="kicker">Administration</p><h1>All resources</h1>
<div id="list"></div>
<div class="pager"><button id="prev" class="secondary" type="button">Previous</button><span id="label"></span><button id="next" class="secondary" type="button">Next</button></div>
</main></div>

<script src="/js/api.js"></script>
<script>
let page = 0;
async function load() {
  const data = await api("/api/admin/listings?page=" + page + "&size=10");
  document.getElementById("label").textContent = `Page ${data.page + 1} of ${Math.max(1, Math.ceil(data.total / data.size))}`;
  document.getElementById("list").innerHTML = data.items.map(item => `
    <article class="card" style="margin-bottom:10px">
      <h3>${escapeHtml(item.title)} ${badge(item.listingStatus)}</h3>
      <p class="note">${escapeHtml(item.ownerName)} · ${escapeHtml(item.category)} · ${item.units.length} units · ${stars(item.averageRating)}</p>
      <p>${item.units.map(u => `${escapeHtml(u.assetCode)} ${badge(u.status)}`).join(" ") || "No units"}</p>
      ${item.listingStatus === "ACTIVE" ? `<button class="danger small off" data-id="${item.id}" type="button">Deactivate</button>` : ""}
    </article>`).join("") || `<p class="empty">No listings.</p>`;
  document.getElementById("prev").disabled = page === 0;
  document.getElementById("next").disabled = (page + 1) * data.size >= data.total;
  document.querySelectorAll(".off").forEach(btn => btn.onclick = async () => {
    try { await api("/api/admin/listings/" + btn.dataset.id + "/deactivate", { method: "POST" }); toast("Deactivated"); load(); }
    catch (err) { toast(err.message, true); }
  });
}
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("prev").onclick = () => { page--; load(); };
  document.getElementById("next").onclick = () => { page++; load(); };
  load().catch(err => toast(err.message, true));
});
</script>

</body></html>
